# YOLOv8 with P2 (Stride-4) High-Resolution Shallow Feature Head
# Designed for micro-scale target detection (<32x32 pixels) in surveillance streams.

nc: 2 # number of classes (0: alcohol, 1: no-alcohol)
scales:
  n: [0.33, 0.25, 1024] # Nano backbone scale

# YOLOv8 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4 (High-resolution shallow features)
  - [-1, 2, C2f, [128, True]]       # 2
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 2, C2f, [256, True]]       # 4
  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 2, C2f, [512, True]]       # 6
  - [-1, 1, Conv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 1, C2f, [1024, True]]      # 8
  - [-1, 1, SPPF, [1024, 5]]        # 9

# YOLOv8 head with P2 Stride-4 head added
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]       # cat backbone P4
  - [-1, 2, C2f, [512]]             # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]       # cat backbone P3
  - [-1, 2, C2f, [256]]             # 15 (P3/8)

  # Extra Upsample to P2/4 for high-resolution shallow feature recovery
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]       # cat backbone P2 (stride 4)
  - [-1, 2, C2f, [128]]             # 18 (P2/4 - Micro-scale shallow head)

  # Downsample path
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]      # cat P3
  - [-1, 2, C2f, [256]]             # 21 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]      # cat P4
  - [-1, 2, C2f, [512]]             # 24 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]       # cat P5
  - [-1, 2, C2f, [1024]]            # 27 (P5/32)

  # Decoupled Detect head predicting across 4 scales: [P2/4, P3/8, P4/16, P5/32]
  - [[18, 21, 24, 27], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
